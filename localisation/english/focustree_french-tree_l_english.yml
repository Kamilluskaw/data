FRA_entertheyugoslaviancollapse:0 "Enter the Yugoslavian Collapse"
FRA_entertheyugoslaviancollapse_desc:0 "The Yugoslavian Collapse is the current Great Civilwar which is still going on, we had to pick a side and after serious thought we have decided that the Princedom of Yugoslavia is the most compatible with our faction."
FRA_thesofiaparisconcord:0 "The Sofia-Paris Concord"
FRA_thesofiaparisconcord_desc:0 "The Bulgarian State has proved to be a good trustworthy ally in the east."
FRA_isolatethecrown:0 "Isolate the Crown"
FRA_isolatethecrown_desc:0 "The Habsburg crown of Austria-Hungary, or otherwise called the Crownlands needs  to be left behind, they might be on our side as of now but they won't be soonly."
FRA_counter_moscow:0 "Counter Moscow"
FRA_counter_moscow_desc:0 "The Russian Empire has been pulling diplomatic tricks lately, trying to build a sphere for themselves but they don't know Turkestan has been in French hands for quite some time."
FRA_bribe_mussolini:0 "Bribe Mussolini"
FRA_bribe_mussolini_desc:0 "Mussolini shouldn't be trusted as he is building out a heavily dictatorial state as of right now but he can be a useful tool for our advantage. To achieve this we can promise them total control over Iberia."
FRA_divide_walloniaflandria:0 "Divide Wallonia-Flandria"
FRA_divide_walloniaflandria_desc:0 "Belgium is a made up nation by the the Crown which should be disbanded as soon as plausible."

FRA_eagle_in_the_sun:0 "Eagle in the Sun"
FRA_eagle_in_the_sun_desc:0 "The Third French Republic came out of the Second Great War as the obvious victor alongside the Italian Republic, due to this we're the deciding nations for the Grand Parisian Congresses conclusions."
FRA_crush_algiers:0 "Crush Algiers"
FRA_crush_algiers_desc:0 "But before that we have to deal with the Algerian rebellion which begun just a couple of months back."
FRA_order_greece_to_end_sparta:0 "Order Greece to end Sparta"
FRA_order_greece_to_end_sparta_desc:0 "On the other side of the Mediterranean we can find the only filthy communist nation of Europe whomst we have to defeat before the congress can take place."
